name: NutraVision
options:
  bundleIdPrefix: com.nutravision
  deploymentTarget:
    iOS: "17.2"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    from: 1.0.0
  NutraCore:
    path: NutraCore
targets:
  NutraVision:
    type: application
    platform: iOS
    sources:
      - path: NutraVision
        excludes:
          - Info.plist
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        INFOPLIST_FILE: NutraVision/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(NV_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: NutraVision/NutraVision.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Supabase
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: NutraCore
    scheme:
      testTargets:
        - NutraVisionUITests
  NutraVisionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NutraVisionUITests
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(NV_BUNDLE_ID).uitests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: NutraVision
    dependencies:
      - target: NutraVision
